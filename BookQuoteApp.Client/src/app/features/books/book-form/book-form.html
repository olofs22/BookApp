<div class="container mt-4">
  <div class="row justify-content-center">
    <div class="col-12 col-md-8 col-lg-6">

      <h2 class="mb-4">
        <i class="fa-solid" [class.fa-plus]="!isEditMode" [class.fa-pen]="isEditMode"></i>
        {{ isEditMode ? 'Redigera bok' : 'Lägg till ny bok' }}
      </h2>

      <form [formGroup]="bookForm" (ngSubmit)="onSubmit()">

        <div class="mb-3">
          <label for="title" class="form-label">Titel</label>
          <input
            id="title"
            type="text"
            class="form-control"
            formControlName="title"
          />
        </div>

        <div class="mb-3">
          <label for="authorName" class="form-label">Författare</label>
          <input
            id="authorName"
            type="text"
            class="form-control"
            formControlName="authorName"
          />
        </div>

        <div class="mb-3">
          <label for="publisherName" class="form-label">Förlag (valfritt)</label>
          <input
            id="publisherName"
            type="text"
            class="form-control"
            formControlName="publisherName"
          />
        </div>

        <div class="mb-3">
          <label for="publishDate" class="form-label">Utgivningsdatum</label>
          <input
            id="publishDate"
            type="date"
            class="form-control"
            formControlName="publishDate"
          />
        </div>

        <div class="alert alert-danger py-2" *ngIf="errorMessage">
          {{ errorMessage }}
        </div>

        <div class="d-flex gap-2 flex-wrap">
          <button type="submit" class="btn btn-primary" [disabled]="bookForm.invalid">
            <i class="fa-solid fa-check"></i> Spara
          </button>
          <a routerLink="/books" class="btn btn-outline-secondary">
            <i class="fa-solid fa-xmark"></i> Avbryt
          </a>
        </div>

      </form>

    </div>
  </div>
</div>
