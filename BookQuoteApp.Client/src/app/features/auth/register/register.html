<div class="auth-wrapper container-fluid d-flex justify-content-center align-items-center px-3" >
 <div class="auth-card card shadow-sm p-4 w-100">
    <h2 class="text-center mb-4">
        <i class="fa-solid fa-book"></i> Register
    </h2>

    <form [formGroup]="registerForm" (ngSubmit)="onSubmit()">
        <div class mb-3>
        <label for="email" class="form-label">Name</label>
        <input 
        id="name"
        type="text"
        class="form-control"
        formControlName="name"
    />
    </div>

    <div class="mb-3">
        <label for="email" class="form-label">Email</label>
        <input 
        id="email"
        type="email"
        class="form-control"
        formControlName="email"
        />
    </div>

    <div class="mb-3">
        <label for="password" class="form-label">Password</label>
        <input 
        id="password"
        type="password"
        class="form-control"
        formControlName="password"
        />
        <ul class="list-unstyled small mt-2 mb-0">
            <li [class.text-success]="hasLength" [class.text-muted]="!hasLength">
                <i class="fa-solid" [class.fa-circle-check]="hasLength" [class.fa-circle]="!hasLength"></i>
                Min. 8 characters
            </li>
            <li [class.text-success]="hasUpper" [class.text-muted]="!hasUpper">
                <i class="fa-solid" [class.fa-circle-check]="hasUpper" [class.fa-circle]="!hasUpper"></i>
                One capital letter
            </li>
            <li [class.text-success]="hasDigit" [class.text-muted]="!hasDigit">
                <i class="fa-solid" [class.fa-circle-check]="hasDigit" [class.fa-circle]="!hasDigit"></i>
                One digit
            </li>
</ul>
    </div>

    <div class="alert alert-danger py-2" *ngIf="errorMessage">
        {{errorMessage}}
    </div>

    <button type="submit" class="btn btn-primary w-100" [disabled]=""loginForm.invalid>
        <i class="fa-solid fa-right-to-bracket"></i> Register
    </button>

    <p class="text-center mt-3 mb-0">
        Already have an account? <a routerLink="/login">Log in here!</a>
    </p>
    
    </form>
 </div>
</div>
