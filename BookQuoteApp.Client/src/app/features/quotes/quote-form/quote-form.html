<div class="container mt-4">
  <div class="row justify-content-center">
    <div class="col-12 col-md-8 col-lg-6">

      <h2 class="mb-4">
        <i class="fa-solid" [class.fa-plus]="!isEditMode" [class.fa-pen]="isEditMode"></i>
        {{ isEditMode ? 'Edit quote' : 'Add quote' }}
      </h2>

      <form [formGroup]="quoteForm" (ngSubmit)="onSubmit()">

        <div class="mb-3">
          <label for="text" class="form-label">Quote</label>
          <textarea
            id="text"
            class="form-control"
            rows="3"
            formControlName="text"
          ></textarea>
        </div>

        <div class="mb-3">
          <label for="authorName" class="form-label">Author</label>
          <input
            id="authorName"
            type="text"
            class="form-control"
            formControlName="authorName"
          />
        </div>

        <div class="mb-3">
          <label for="bookId" class="form-label">Book</label>
          <select
            id="bookId"
            class="form-select"
            formControlName="bookId"
          >
            <option value="" disabled>Choose a book</option>
            <option *ngFor="let book of books" [value]="book.id">
              {{ book.title }}
            </option>
          </select>
        </div>

        <div class="alert alert-danger py-2" *ngIf="errorMessage">
          {{ errorMessage }}
        </div>

        <div class="d-flex gap-2 flex-wrap">
          <button type="submit" class="btn btn-primary" [disabled]="quoteForm.invalid">
            <i class="fa-solid fa-check"></i> Save
          </button>
          <a routerLink="/quotes" class="btn btn-outline-secondary">
            <i class="fa-solid fa-xmark"></i> Cancel
          </a>
        </div>

      </form>

    </div>
  </div>
</div>
