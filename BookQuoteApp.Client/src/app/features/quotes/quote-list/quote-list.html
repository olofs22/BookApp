<div class="container mt-4">

  <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
    <h2 class="mb-0">
      <i class="fa-solid fa-quote-left"></i> Mina citat
    </h2>
    <a routerLink="/quotes/add" class="btn btn-success">
      <i class="fa-solid fa-plus"></i> Lägg till citat
    </a>
  </div>

  <div class="row g-3">
    <div class="col-12 col-md-6 col-lg-4" *ngFor="let quote of quotes">
      <div class="card h-100 shadow-sm">
        <div class="card-body d-flex flex-column">
          <p class="card-text fst-italic">"{{ quote.text }}"</p>
          <p class="card-subtitle text-muted mb-2">— {{ quote.authorName }}</p>
          <p class="card-subtitle text-muted small mb-3">
            <i class="fa-solid fa-book"></i> {{ quote.bookTitle }}
          </p>

          <div class="mt-auto d-flex gap-2">
            <a [routerLink]="['/quotes/edit', quote.id]" class="btn btn-sm btn-outline-primary">
              <i class="fa-solid fa-pen"></i> Redigera
            </a>
            <button (click)="deleteQuote(quote.id)" class="btn btn-sm btn-outline-danger">
              <i class="fa-solid fa-trash"></i> Radera
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <p *ngIf="quotes.length === 0" class="text-center text-muted py-4">
    Inga citat tillagda än.
  </p>

</div>
